apiVersion: v1
kind: LimitRange
metadata:
  name: foodrush-frontend-limits
  namespace: foodrush-frontend
spec:
  limits:
    - type: Container
      default:
        cpu: 100m
        memory: 128Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: 500m
        memory: 512Mi
      min:
        cpu: 10m
        memory: 32Mi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: foodrush-backend-limits
  namespace: foodrush-backend
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: 1000m
        memory: 1Gi
      min:
        cpu: 10m
        memory: 32Mi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: foodrush-data-limits
  namespace: foodrush-data
spec:
  limits:
    - type: Container
      default:
        cpu: 300m
        memory: 512Mi
      defaultRequest:
        cpu: 200m
        memory: 256Mi
      max:
        cpu: 2000m
        memory: 2Gi
      min:
        cpu: 10m
        memory: 32Mi
