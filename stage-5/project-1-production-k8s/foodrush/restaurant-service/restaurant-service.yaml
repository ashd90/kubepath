apiVersion: v1
kind: ConfigMap
metadata:
  name: restaurant-config
  namespace: foodrush-backend
data:
  DB_HOST: "postgres-service.foodrush-data.svc.cluster.local"
  DB_NAME: "foodrush"
  DB_USER: "foodrush_user"
---
apiVersion: v1
kind: Secret
metadata:
  name: restaurant-secret
  namespace: foodrush-backend
type: Opaque
stringData:
  DB_PASSWORD: "foodrush@secure123"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-service
  namespace: foodrush-backend
  labels:
    app: restaurant-service
    tier: backend
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: restaurant-service
  template:
    metadata:
      labels:
        app: restaurant-service
        tier: backend
        version: v1
    spec:
      containers:
        - name: restaurant-service
          image: restaurant-service:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: restaurant-config
            - secretRef:
                name: restaurant-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: restaurant-service
  namespace: foodrush-backend
spec:
  selector:
    app: restaurant-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
