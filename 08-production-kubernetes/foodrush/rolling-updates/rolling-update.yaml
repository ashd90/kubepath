apiVersion: apps/v1
kind: Deployment
metadata:
  name: restaurant-service
  namespace: foodrush-backend
  labels:
    app: restaurant-service
    tier: backend
    version: v2
  annotations:
    kubernetes.io/change-cause: "v2.0.0 - Added cuisine categories endpoint"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: restaurant-service
  template:
    metadata:
      labels:
        app: restaurant-service
        tier: backend
        version: v2
    spec:
      serviceAccountName: restaurant-service-sa
      containers:
        - name: restaurant-service
          image: restaurant-service:v2
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: restaurant-config
            - secretRef:
                name: restaurant-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
