apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: foodrush-data
data:
  POSTGRES_DB: foodrush
  POSTGRES_USER: foodrush_user
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: foodrush-data
type: Opaque
stringData:
  POSTGRES_PASSWORD: "foodrush@secure123"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: foodrush-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: foodrush-data
  labels:
    app: postgres
    tier: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        tier: data
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: postgres-config
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-script
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: foodrush-data
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
