apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: foodrush-backend
data:
  RESTAURANT_SERVICE_URL: "http://restaurant-service.foodrush-backend.svc.cluster.local"
  ORDER_SERVICE_URL: "http://order-service.foodrush-backend.svc.cluster.local"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: foodrush-backend
  labels:
    app: api-gateway
    tier: backend
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        tier: backend
        version: v1
    spec:
      containers:
        - name: api-gateway
          image: api-gateway:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: gateway-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: foodrush-backend
spec:
  selector:
    app: api-gateway
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
